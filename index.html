<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Form Registrasi</title>
</head>
<body>

    <h2>Form Registrasi</h2>

    <form action="#" method="POST" enctype="multipart/form-data">

        <fieldset>
            <legend>Biodata</legend>
            <table border="0" cellpadding="3" cellspacing="0">
                <tr>
                    <td><label for="nama">Nama Mahasiswa</label></td>
                    <td>:</td>
                    <td><input type="text" id="nama" name="nama" placeholder="Nama Anda"></td>
                </tr>
                <tr>
                    <td><label for="nim">No Induk Mahasiswa (NIM)</label></td>
                    <td>:</td>
                    <td><input type="text" id="nim" name="nim" placeholder="123456789"></td>
                </tr>
                <tr>
                    <td valign="top"><label for="alamat">Alamat Mahasiswa</label></td>
                    <td valign="top">:</td>
                    <td><textarea id="alamat" name="alamat" rows="4" cols="30" placeholder="Alamat Anda"></textarea></td>
                </tr>
                <tr>
                    <td>Tanggal Lahir</td>
                    <td>:</td>
                    <td>
                        <select name="tgl">
                            <option value="01">01</option>
                            <option value="02">02</option>
                            <option value="03">03</option>
                            <option value="04">04</option>
                            <option value="05">05</option>      
                            <option value="06">06</option>
                            <option value="07">07</option>
                            <option value="08">08</option>
                            <option value="09">09</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>  
                            <option value="13">13</option>
                            <option value="14">14</option>
                            <option value="15">15</option>
                            <option value="16">16</option>
                            <option value="17">17</option>
                            <option value="18">18</option>
                            <option value="19">19</option>
                            <option value="20">20</option>
                            <option value="21">21</option>
                            <option value="22">22</option>
                            <option value="23">23</option>
                            <option value="24">24</option>
                            <option value="25">25</option>
                            <option value="26">26</option>
                            <option value="27">27</option>
                            <option value="28">28</option>
                            <option value="29">29</option>                                
                            <option value="30">30</option>
                            <option value="31">31</option>
                        </select>
                        
                        <select name="bln">
                            <option value="Januari">Januari</option>
                            <option value="Februari">Februari</option>
                            <option value="Maret">Maret</option>
                            <option value="April">April</option>
                            <option value="Mei">Mei</option>
                            <option value="Juni">Juni</option>
                            <option value="Juli">Juli</option>
                            <option value="Agustus">Agustus</option>
                            <option value="September">September</option>
                            <option value="Oktober">Oktober</option>
                            <option value="November">November</option>
                            <option value="Desember">Desember</option>
                        </select>

                        <select name="thn">
                            <option value="1990">1990</option>
                            <option value="1991">1991</option>
                            <option value="1992">1992</option>      
                            <option value="1993">1993</option>
                            <option value="1994">1994</option>
                            <option value="1995">1995</option>
                            <option value="1996">1996</option>
                            <option value="1997">1997</option>
                            <option value="1998">1998</option>
                            <option value="1999">1999</option>
                            <option value="2000">2000</option>
                        </select>
                        
                    </td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:</td>
                    <td>
                        <input type="radio" id="pria" name="jk" value="Pria" checked>
                        <label for="pria">Pria</label>
                        <input type="radio" id="wanita" name="jk" value="Wanita">
                        <label for="wanita">Wanita</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="foto">Upload Foto</label></td>
                    <td>:</td>
                    <td><input type="file" id="foto" name="foto"></td>
                </tr>
                <tr>
                    <td><label for="url">URL Website</label></td>
                    <td>:</td>
                    <td><input type="url" id="url" name="url" placeholder="URL Website Anda" size="30"></td>
                </tr>
                <tr>
                    <td><label for="pt">Pergiuan Tinggi</label></td>
                    <td>:</td>
                    <td><input type="text" id="pt" name="pt"></td>
                </tr>
            </table>
        </fieldset>

        <br>

      
        <fieldset>
            <legend>Info Akun</legend>
            <table border="0" cellpadding="3" cellspacing="0">
                <tr>
                    <td><label for="email">Email</label></td>
                    <td>:</td>
                    <td><input type="email" id="email" name="email" placeholder="Email Anda"></td>
                </tr>
                <tr>
                    <td><label for="username">Username</label></td>
                    <td>:</td>
                    <td><input type="text" id="username" name="username" placeholder="Username Anda"></td>
                </tr>
                <tr>
                    <td><label for="password">Password</label></td>
                    <td>:</td>
                    <td><input type="password" id="password" name="password" placeholder="Password Anda"></td>
                </tr>
                <tr>
                    <td><label for="ulang_password">Ulangi Password</label></td>
                    <td>:</td>
                    <td><input type="password" id="ulang_password" name="ulang_password" placeholder="Password Anda"></td>
                </tr>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend>Kemampuan Dasar</legend>
            <input type="checkbox" id="html" name="kemampuan[]" value="HTML">
            <label for="html">HTML</label>
            
            <input type="checkbox" id="css" name="kemampuan[]" value="CSS">
            <label for="css">CSS</label>
            
            <input type="checkbox" id="js" name="kemampuan[]" value="Javascript">
            <label for="js">Javascript</label>
            
            <input type="checkbox" id="php" name="kemampuan[]" value="PHP">
            <label for="php">PHP</label>
            
            <input type="checkbox" id="mysql" name="kemampuan[]" value="MySQL">
            <label for="mysql">MySQL</label>
            
            <input type="checkbox" id="laravel" name="kemampuan[]" value="Laravel">
            <label for="laravel">Laravel</label>
            
            <input type="checkbox" id="react" name="kemampuan[]" value="React Native">
            <label for="react">React Native</label>
        </fieldset>

        <br>

        <input type="reset" value="Reset">
        <input type="submit" value="Simpan">
        <input type="button" value="Button">

    </form>

</body>
</html>
